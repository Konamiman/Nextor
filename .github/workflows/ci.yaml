name: CI

on:
  pull_request:
  push:
    branches:
      - 'v**'
    tags:
      - 'v**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            sdcc binutils make
      - name: Make all
        run: make -C source -j $(nproc) V=1
