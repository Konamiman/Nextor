name: CI

on:
  pull_request:
    paths:
      - 'source/**'
      - 'sdk/**'
      - 'buildtools/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'docker/Dockerfile'   # defines the Nestor80 tool versions this job installs
  push:
    paths:
      - 'source/**'
      - 'sdk/**'
      - 'buildtools/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'docker/Dockerfile'   # defines the Nestor80 tool versions this job installs
    branches:
      - 'v**'
    tags:
      - 'v**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Shared with the dev build workflow
      - name: Set up the build toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Make all
        run: make -C source
      - name: Build tools disk
        run: make -C source tools-disk
      - name: Build tools zip
        run: make -C source tools-zip
      - name: Verify sdk/nextor-kernel-version.txt is in sync
        run: |
          rm -f sdk/nextor-kernel-version.txt
          make -C source/kernel ../../sdk/nextor-kernel-version.txt
          git diff --exit-code -- sdk/nextor-kernel-version.txt
