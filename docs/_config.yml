# Jekyll settings for the GitHub Pages site served from this directory
# (Settings > Pages > Deploy from a branch, folder /docs).
#
# Nothing here is required for the site to work: GitHub Pages already serves
# README.md as the index page, converts the other .md files to HTML (rewriting
# the links between them) and applies the default theme. This file only sets
# the metadata the theme displays in the page header and <title>, and pins
# the theme so that it doesn't change under us.
#
# The releases page at docs/releases is plain HTML generated by
# .github/categorized-releases/generate.sh; Jekyll copies it as it is.

title: Nextor
description: A disk operating system for MSX computers, forked from MSX-DOS 2.31
theme: jekyll-theme-primer
