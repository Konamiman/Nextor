    const categoryData = {"latest-page":{"name":"Latest","description":"The most recent release of every component. Switch to the **Assets** view\nto get a flat list of the latest version of every downloadable file. Note that\n`tools.zip` contains all the tools' .COM files, and `nextor.dsk` is a disk image\nthat contains all the tools' .COM files plus NEXTOR.SYS and COMMAND3.COM.\n","releases":[],"assets":[],"children":[],"isLatestPage":true},"index":{"name":"Index","description":"","releases":[],"children":[],"isIndex":true}};
    const categoryReleasesHtml = {"latest-page":"<p class=\"latest-empty\"><em>There are no releases marked as latest</em></p>","index":""};
    const categoryDescriptionsHtml = {"latest-page":"<p>The most recent release of every component. Switch to the <strong>Assets</strong> view\nto get a flat list of the latest version of every downloadable file. Note that\n<code>tools.zip</code> contains all the tools&#39; .COM files, and <code>nextor.dsk</code> is a disk image\nthat contains all the tools&#39; .COM files plus NEXTOR.SYS and COMMAND3.COM.</p>\n","index":"<h1>Nextor releases</h1>\n<p><a href=\"https://github.com/Konamiman/Nextor\">Nextor</a> is an enhanced version of MSX-DOS 2 for MSX computers. Starting with Nextor 3, each component of the system is released separately, so this page groups the releases of <a href=\"https://github.com/Konamiman/Nextor/releases\">the Nextor repository</a> by component. Choose a component in the side menu to see its releases, or go to <strong>Latest</strong> to get the most recent version of everything in one place.</p>\n<h2>What&#39;s what</h2>\n<ul>\n<li><p><strong>Kernel base</strong>: the Nextor kernel without any device driver, as a <code>.dat</code> file. Driver developers combine it with their driver using <code>mknexrom</code> to produce a complete kernel ROM. Available in several variants (<code>NO_UNDOC</code>, <code>SHIFT_INV</code>, <code>CTRL_INV</code>, <code>KANJI_INV</code>), explained in the category itself.</p>\n</li>\n<li><p><strong>Drivers</strong>: the device drivers supplied with the Nextor repository.</p>\n<ul>\n<li><strong>Standalone ROMs</strong>: complete kernel ROMs with a dummy device driver that handles no devices, for computers and emulators where the storage devices are handled by other ROMs, or for testing drivers loaded in RAM.</li>\n<li><strong>Example RAM driver</strong>: a minimal driver loadable in RAM, intended as a template and a test subject for driver developers.</li>\n</ul>\n</li>\n<li><p><strong>NEXTOR.SYS</strong>: the DOS system file, Nextor&#39;s version of <code>MSXDOS2.SYS</code>, loaded from the boot drive to bring up the DOS environment (English and Japanese variants are available).</p>\n</li>\n<li><p><strong>COMMAND3.COM</strong>: the Nextor 3 command interpreter, an enhanced replacement for <code>COMMAND2.COM</code>.</p>\n</li>\n<li><p><strong>Tools</strong>: the command line tools (<code>.COM</code> files to be run from the DOS prompt). The <strong>Tools disk image</strong> is a bootable disk with <code>NEXTOR.SYS</code>, <code>COMMAND3.COM</code>, all the tools and the help files; the <strong>Tools ZIP file</strong> contains just the tools. Each tool has also its own entry, listing the releases that contain that particular tool.</p>\n</li>\n<li><p><strong>Build tools</strong>: tools that run on a PC, not on the MSX. Currently just <strong>mknexrom</strong>, the tool that produces kernel ROMs from a kernel base file and a driver.</p>\n</li>\n</ul>\n<h2>About drivers</h2>\n<p>This repository doesn&#39;t contain drivers for specific storage devices: only the standalone ROMs (whose driver is a dummy one that handles no devices) and the example RAM driver. Drivers for actual devices (Sunrise IDE, MegaFlashROM SCC+ SD, and others) are developed and released in their own repositories; see the <a href=\"https://github.com/Konamiman/Nextor/blob/v3.0/docs/Nextor_3.0_Known_Drivers.md\">Known Drivers</a> document for the list and where to get each one.</p>\n<h2>Looking for Nextor 2?</h2>\n<p>This page lists Nextor 3 releases only. The Nextor 2 releases (which include the kernel ROMs for all the drivers that used to live in this repository) are available directly in GitHub: <a href=\"https://github.com/Konamiman/Nextor/releases?q=v2.&expanded=true\">Nextor 2 releases</a>. The latest Nextor 2 version is <a href=\"https://github.com/Konamiman/Nextor/releases/tag/v2.1.4\">v2.1.4</a>.</p>\n<h2>Documentation</h2>\n<p>The <a href=\"https://github.com/Konamiman/Nextor/tree/v3.0/docs\">Nextor 3.0 documentation</a> includes a <a href=\"https://github.com/Konamiman/Nextor/blob/v3.0/docs/Nextor_3.0_Getting_Started_Guide.md\">Getting Started Guide</a>, the <a href=\"https://github.com/Konamiman/Nextor/blob/v3.0/docs/Nextor_3.0_User_Manual.md\">User Manual</a>, the <a href=\"https://github.com/Konamiman/Nextor/blob/v3.0/docs/Nextor_3.0_Programmers_Reference.md\">Programmers Reference</a> and the <a href=\"https://github.com/Konamiman/Nextor/blob/v3.0/docs/Nextor_3.0_Driver_Development_Guide.md\">Driver Development Guide</a>.</p>\n"};
